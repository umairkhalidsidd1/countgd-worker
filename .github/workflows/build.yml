name: build-countgd-worker

# Manual only. This pushes a ~15GB image; it should never fire on a whim.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['Dockerfile', 'overlay/**', '.github/workflows/build.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # The base CUDA image plus 2.6GB of weights plus a torch install does not
      # fit next to the runner's preinstalled toolchains. Reclaim first, or the
      # build dies with "no space left on device" three quarters of the way in.
      - name: Reclaim disk
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/lib/node_modules \
                      /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -af || true
          echo "after:"; df -h / | tail -1

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # RunPod workers are x86_64 only. Building a second arch would double
          # the time for an image that can never be scheduled.
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/countgd-worker:latest
            ghcr.io/${{ github.repository_owner }}/countgd-worker:${{ github.sha }}
          provenance: false

      - name: Report size
        run: |
          echo "pushed ghcr.io/${{ github.repository_owner }}/countgd-worker:latest"
          df -h / | tail -1
